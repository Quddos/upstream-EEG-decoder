[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    -m "not physionet"
markers =
    physionet: requires a live download from physionet.org; deselected by default.
        Run with `pytest -m physionet` in an environment with network access.
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning:mne.*
